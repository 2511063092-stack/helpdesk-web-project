<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hệ thống Helpdesk{% endblock %}</title>
    <!-- nhúng bootstrap 5 qua CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- thanh điều hướng dùng chung -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'ticket_list' %}">IT Helpdesk</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white"href="{% url 'ticket_list' %}">Danh sách yêu cầu</a>
                <a class="nav-link text-white" href="/admin/">Quản trị (Admin)</a>
            </div>
        </div>
    </nav>

    <!-- khung nội dung riêng của từng trang con-->
    <main class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main> 
</body>
</html>
